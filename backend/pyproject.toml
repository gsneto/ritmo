[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "database",
    "models",
    "rate_limit",
    "routers",
    "schemas",
    "security",
    "services",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["^alembic/", "^tests/"]

[[tool.mypy.overrides]]
module = ["pywebpush", "pywebpush.*"]
ignore_missing_imports = true

# The legacy declarative ORM is migrated to Mapped types incrementally. Keep
# the typed infrastructure/services gate useful without hiding new errors in
# the modules already included by CI.
[[tool.mypy.overrides]]
module = [
    "database",
    "models.*",
    "push_scheduler",
    "routers.*",
    "seed",
    "services.anahi_context",
]
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["."]
omit = ["alembic/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
