name: Production health monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'https://supportive-warmth-production-dd70.up.railway.app/health' }}
    steps:
      - name: Check API and database health
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            "$HEALTHCHECK_URL")"
          jq -e '.status == "healthy"' <<<"$response" >/dev/null

      - name: Open outage issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          HEALTHCHECK_URL: ${{ env.HEALTHCHECK_URL }}
        with:
          script: |
            const title = '[Uptime] API do Ritmo indisponível'
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `O monitor não recebeu uma resposta saudável de ${process.env.HEALTHCHECK_URL}.\n\nExecução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              })
            }

      - name: Close recovered outage issue
        if: steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Uptime] API do Ritmo indisponível'
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            for (const issue of issues.filter(item => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'O endpoint voltou a responder como saudável. Incidente encerrado automaticamente.',
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              })
            }

      - name: Mark unhealthy run as failed
        if: steps.check.outcome == 'failure'
        run: exit 1
