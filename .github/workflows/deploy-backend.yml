name: Backend CI and manual release

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar o backend somente depois dos testes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Lint Python sources
        run: python -m ruff check .

      - name: Type-check Python sources
        run: >-
          python -m mypy
          config.py main.py rate_limit.py security.py time_utils.py
          services/anahi.py schemas

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -q

      - name: Build backend image
        run: docker build --tag ritmo-backend:ci .

  publish:
    name: Publish backend
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: backend-production
    defaults:
      run:
        working-directory: backend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
      APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for Railway CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check release configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT RAILWAY_SERVICE BACKEND_BASE_URL APP_ACCESS_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name não foi configurado no ambiente backend-production."
              exit 1
            fi
          done

          if [[ "$BACKEND_BASE_URL" != https://* ]]; then
            echo "::error::BACKEND_BASE_URL must be the public HTTPS API origin."
            exit 1
          fi

      - name: Publish tested backend
        run: >-
          npx --yes @railway/cli@5.30.1 up .
          --path-as-root
          --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_SERVICE"

      - name: Smoke test published backend
        shell: bash
        run: |
          set -euo pipefail
          base_url="${BACKEND_BASE_URL%/}"

          health_json="$(
            curl --fail --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 20 \
              "$base_url/health"
          )"
          jq -e '.status == "healthy"' <<<"$health_json" >/dev/null

          protected_json="$(
            curl --fail --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 20 \
              --header "X-Ritmo-Key: $APP_ACCESS_TOKEN" \
              "$base_url/api"
          )"
          jq -e '.message and .version' <<<"$protected_json" >/dev/null
