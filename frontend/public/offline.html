<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c92520" />
    <title>Ritmo offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: #f2efe9;
        color: #211e1b;
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        width: min(100%, 440px);
        overflow: hidden;
        border: 1px solid #ddd5ca;
        border-radius: 22px;
        background: #fffdf9;
        box-shadow: 0 20px 55px rgba(45, 34, 28, .12);
      }
      img { display: block; width: 100%; height: 86px; object-fit: cover; }
      section { display: grid; gap: 12px; padding: 26px; }
      h1, p { margin: 0; }
      h1 { font-size: 1.55rem; }
      p { color: #736b63; line-height: 1.55; }
      button {
        min-height: 46px;
        border: 0;
        border-radius: 12px;
        background: #c92520;
        color: white;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/grafismo-indigena-ritmo.png" alt="" />
      <section>
        <h1>Você está sem internet</h1>
        <p>O Ritmo continua instalado. Reconecte-se para consultar e atualizar seus dados.</p>
        <button type="button" onclick="location.reload()">Tentar novamente</button>
      </section>
    </main>
  </body>
</html>
